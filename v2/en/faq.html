<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ — NiYien A1</title>
<meta name="description" content="NiYien A1 frequently asked questions.">
<link rel="icon" href="/assets/icon/logo.png">
<link rel="stylesheet" href="../shared/style.css">
<style>
  .faq-item { border-bottom: 1px solid var(--line); }
  .faq-item summary { padding: 18px 0; font-size: 16px; font-weight: 600; color: var(--ink);
                      cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  .faq-item summary::after { content: '+'; color: var(--muted); font-size: 20px; }
  .faq-item[open] summary::after { content: '–'; }
  .faq-a { padding: 0 0 20px; font-size: 14.5px; }
  .faq-a img { max-width: 560px; width: 100%; border: 1px solid var(--line);
               border-radius: 10px; margin: 10px 0; }
</style>
</head>
<body data-page="faq">
<div class="nav-mount"></div>
<main>
<div class="page-head"><div class="container"><h1 class="h2">FAQ</h1></div></div>
<div class="container" style="max-width:760px;padding-bottom:24px">

  <!-- FAQ content placeholder — entries will be rewritten by the site owner -->
  <div class="card" style="padding:40px 24px;text-align:center;margin-top:24px">
    <span class="badge-wip">In preparation</span>
    <p style="margin-top:14px;color:var(--muted)">The FAQ is being rewritten and will be back soon.</p>
  </div>

  <h2 class="h3" id="community" style="margin-top:48px">Join the community</h2>
  <p class="small" style="margin-top:8px">Scan to join our WeChat group.</p>
  <img src="/assets/qrcode/VX.png" alt="WeChat group QR code" style="max-width:240px;border:1px solid var(--line);border-radius:12px;margin-top:12px">

  <h2 class="h3" id="contact" style="margin-top:40px">Contact us</h2>
  <p class="small" style="margin-top:8px">If you need help, scan the QR code above to join our WeChat group — we answer questions there.</p>
</div>
</main>
<div class="footer-mount"></div>
<script src="../shared/site.js" defer></script>
</body>
</html>
