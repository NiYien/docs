<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NiYien</title>
<script>
(function () {
  var targets = { zh: "/v2/zh/index.html", en: "/v2/en/index.html" };
  var params = new URLSearchParams(window.location.search);
  var forced = (params.get("lang") || "").toLowerCase();
  if (Object.prototype.hasOwnProperty.call(targets, forced)) { window.location.replace(targets[forced]); return; }
  var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  var chosen = "en";
  for (var i = 0; i < languages.length; i++) {
    var l = String(languages[i] || "").toLowerCase();
    if (l.indexOf("zh") === 0) { chosen = "zh"; break; }
    if (l.indexOf("en") === 0) { chosen = "en"; break; }
  }
  window.location.replace(targets[chosen]);
})();
</script>
</head>
<body>
<p><a href="/v2/zh/index.html">中文</a> / <a href="/v2/en/index.html">English</a></p>
</body>
</html>
