<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>style probe</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<div class="container section">
  <div class="eyebrow">EYEBROW 眉题</div>
  <h1 class="h1">H1 每一帧，都稳定</h1>
  <h2 class="h2">H2 区块标题</h2>

  <p class="small">small 辅助文字</p>
  <p style="margin-top:20px">

    <a class="btn-outline" href="#">次按钮</a>

    <span class="badge-wip">制作中</span>
  </p>
  <div class="grid-2" style="margin-top:24px">
    <div class="card" style="padding:20px"><h3 class="h3">卡片 A</h3><p class="small">hover 测试</p></div>
    <div class="card" style="padding:20px"><h3 class="h3">卡片 B</h3><p class="small">hover 测试</p></div>
  </div>
</div>
<div class="section section-alt"><div class="container">section-alt 浅灰交替区块</div></div>

</html>
